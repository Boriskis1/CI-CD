name: Full Stack Application Deployment Test

# Триггеры запуска
on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Запуск на нашем компьютере (Self-Hosted Runner)
jobs:
  deploy-and-test:
    runs-on: self-hosted
    
    steps:
    - name: Checkout code
      # Скачиваем код репозитория на раннер
      uses: actions/checkout@v4

      # Создаем файл .env из секретов GitHub 
    - name: Create .env file from secrets
      run: |
        echo "Creating .env file from GitHub Secrets..."
        $envContent = @(
          "DB_HOST=${{ secrets.DB_HOST }}"
          "DB_PORT=${{ secrets.DB_PORT }}"
          "DB_NAME=${{ secrets.DB_NAME }}"
          "DB_USER=${{ secrets.DB_USER }}"
          "DB_PASSWORD=${{ secrets.DB_PASSWORD }}"
          "APP_PORT=${{ secrets.APP_PORT }}"
        )
        Set-Content -Path .env -Value $envContent -Encoding ascii
        echo " .env file created successfully"
      shell: powershell

      # Останавливаем старые контейнеры
      # Собираем и запускаем стек в фоне 
    - name: Deploy with Docker Compose
      run: |
        echo " Starting application stack..."
        docker compose down
        docker compose up -d --build
        echo " Waiting for services to start..."
        Start-Sleep -Seconds 15
        echo " Checking container status..."
        docker compose ps
      shell: powershell

      # Проверяем, что контейнеры  запустились
    - name: Verify containers are running
      run: |
        $status = docker compose ps
        if ($status -match "Up") {
          echo " All containers are running"
        } else {
          echo " Some containers failed to start"
          docker compose logs
          exit 1
        }
      shell: powershell

      # Проверяем работу приложения и подключение к БД 
    - name: Run application tests
      run: |
        echo " Running application tests..."
        
        $health = curl.exe -s http://localhost:${{ secrets.APP_PORT }}/health
        if ($health -match "ok") {
          echo " Web application is healthy"
        } else {
          echo " Web application health check failed"
          exit 1
        }

        $response = curl.exe -s http://localhost:${{ secrets.APP_PORT }}/api/items
        if ($response -match "first item") {
          echo " Application database connection working"
        } else {
          echo " Application database connection failed"
          exit 1
        }
      shell: powershell

    - name: Create test report
      run: |
        $date = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
        $report = @(
          "# Deployment Test Report"
          "- Date: $date"
          "- Application: Healthy"
          "- Database: Connected"
          "- Containers: Running"
          ""
          "## Environment Variables"
          "- DB_HOST: ${{ secrets.DB_HOST }}"
          "- DB_NAME: ${{ secrets.DB_NAME }}"
          "- APP_PORT: ${{ secrets.APP_PORT }}"
        )
        Set-Content -Path test-report.md -Value $report -Encoding ascii
      shell: powershell

      # Сохраняем конфигурационные файлы как артефакты
    - name: Save artifacts 
      uses: actions/upload-artifact@v4
      with:
        name: deployment-artifacts
        path: |
          .env
          docker-compose.yml
        retention-days: 30

      # Сохраняем логи контейнеров, даже если тесты упали 
    - name: Save Docker logs
      if: always()
      run: |
        echo " Saving Docker logs..."
        docker compose logs | Out-File -FilePath deployment-logs.txt -Encoding ascii
        docker images > docker-images.txt
        docker ps -a > docker-ps.txt
      shell: powershell

      # Загружаем сохраненные логи как артефакт
    - name: Upload Docker logs as artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-logs
        path: |
          deployment-logs.txt
          docker-images.txt
          docker-ps.txt
        retention-days: 30

    - name: Create test report
      run: |
        $date = Get-Date -Format "yyyy-MM-dd HH:mm:ss"
        $report = @(
          "# Deployment Test Report"
          "- Date: $date"
          "- Application: Healthy"
          "- Database: Connected"
          "- Containers: Running"
          ""
          "## Environment Variables"
          "- DB_HOST: ${{ secrets.DB_HOST }}"
          "- DB_NAME: ${{ secrets.DB_NAME }}"
          "- APP_PORT: ${{ secrets.APP_PORT }}"
        )
        Set-Content -Path test-report.md -Value $report -Encoding ascii
      shell: powershell